[project]
name = "agentseism"
version = "0.1.0"
description = "AgentSeism — turn stochastic agent runs into trustworthy CI decisions"
requires-python = ">=3.11"
authors = [{ name = "Ruxi Zhang", email = "ruxiz2018@gmail.com" }]
license = "Apache-2.0"
readme = "README.md"
dependencies = ["pyyaml>=6"]

[project.scripts]
seism = "agentseism.cli:main"
agentseism = "agentseism.cli:main"   # alias, kept so existing scripts do not break

[project.urls]
Homepage = "https://github.com/lyr-ai/agentseism"
Initiative = "https://github.com/canis-minor"

[project.optional-dependencies]
# `mini-swe-agent` is pinned, not ranged: `tests/test_recovery_challenge.py`
# and `tests/test_c2h_backend.py` import its agent internals, and without it
# nine tests error and one module will not collect -- an environment defect
# that reads exactly like nine product failures. 2.4.6 is the version the eval
# environment already used.
dev = ["pytest>=8.0", "ruff>=0.5", "mini-swe-agent==2.4.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentseism"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
