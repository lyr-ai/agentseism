[project]
name = "agentseism"
version = "0.1.0"
description = "AgentSeism — behavioral weak-point discovery for LLM agents"
requires-python = ">=3.11"
authors = [{ name = "Ruxi Zhang", email = "ruxiz2018@gmail.com" }]
license = "Apache-2.0"
readme = "README.md"
dependencies = []

[project.urls]
Homepage = "https://github.com/lyr-ai/agentseism"
Initiative = "https://github.com/canis-minor"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentseism"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
