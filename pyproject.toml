[project]
name = "agentseism"
version = "0.1.0"
description = "AgentSeism — turn stochastic agent runs into trustworthy CI decisions"
requires-python = ">=3.11"
authors = [{ name = "Ruxi Zhang", email = "ruxiz2018@gmail.com" }]
license = "Apache-2.0"
readme = "README.md"
dependencies = ["pyyaml>=6"]

[project.scripts]
seism = "agentseism.cli:main"
agentseism = "agentseism.cli:main"   # alias, kept so existing scripts do not break

[project.urls]
Homepage = "https://github.com/lyr-ai/agentseism"
Initiative = "https://github.com/canis-minor"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
# The coding agent AgentSeism is validated against. Pinned exactly, not
# floored: the agent under test is part of the comparability fingerprint, so a
# version that moves between the baseline and candidate arms would make the two
# sides incomparable without anything in the contract noticing.
coding-agent = ["mini-swe-agent==2.4.6", "swebench>=2.1", "datasets"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentseism"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
