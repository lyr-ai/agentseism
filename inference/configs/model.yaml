# Serving parameters. Everything that can change an inference result is pinned
# here, so that a later difference is agent variation and not stack drift.
#
# Selected by measurement, not by inheriting the local choice. Of the candidates
# that fit a single 48 GB card, this scores highest on SWE-bench Verified (77.2%)
# and ships official FP8 weights, so no community quantisation and no online
# quantisation is involved.
#
#   Qwen3-Coder-Next-FP8   70.6%   80.4 GB  -- does not fit 48 GB
#   Qwen3.6-27B (bf16)     77.2%   55.6 GB  -- does not fit 48 GB
#   Qwen3.6-27B-FP8        77.2%   30.9 GB  -- fits, ~17 GB left for KV cache
#   Devstral-Small-2-24B   68.0%   51.6 GB  -- does not fit at bf16

model:
  id: "Qwen/Qwen3.6-27B-FP8"
  revision: "e89b16ebf1988b3d6befa7de50abc2d76f26eb09"
  quantization: fp8         # weights are already FP8; vLLM reads it from the config
  dtype: auto
  trust_remote_code: false

serving:
  max_model_len: 32768
  # Deliberately not the 262k this model supports. max_model_len is what reserves
  # KV cache, so starting small makes the split between weights, runtime and
  # cache visible on a 48 GB card -- and the qualification only needs 8k/16k
  # stress plus one trajectory that reached ~15k. Raise it to 64k afterwards and
  # watch the cache grow; opening at 262k would OOM and teach nothing.
  gpu_memory_utilization: 0.90
  tensor_parallel_size: 1
  # Every example on the model card uses --tensor-parallel-size 8 with a 262k
  # context. That is a configuration for 8 GPUs, not a requirement: 30.9 GB of
  # FP8 weights fit one 48 GB card, and max_model_len is 32768 here. Worth
  # confirming on first boot rather than assuming -- if the architecture turns
  # out to need sharding, that is a reason to stop early, not to improvise.
  enable_prefix_caching: true
  # Prefix caching matters more here than in most workloads: this agent resends
  # its entire history every step, so step N re-prefills everything from step
  # N-1. Without it, prefill cost is quadratic in trajectory length.
  max_num_seqs: 8
  swap_space: 4

  # mini-swe-agent sends `tools=[BASH_TOOL]` on every request
  # (models/litellm_model.py) and reads actions back out of `tool_calls`, not out
  # of fenced code blocks -- the Sonnet trajectories confirm it. Without native
  # tool calling the agent receives no action at all and every step is empty, so
  # this is not optional for this workload.
  enable_auto_tool_choice: true
  tool_call_parser: qwen3_coder
  # Both parser names are taken verbatim from the model card's own vllm serve
  # line, not guessed. An earlier draft had `hermes` here, which would have
  # produced a healthy endpoint that returned no tool calls -- the failure this
  # check exists to catch.
  reasoning_parser: qwen3
  # Qwen3.6 is a reasoning model. Without this, chain-of-thought is returned in
  # the message content instead of a separate field, so the agent would read
  # reasoning as if it were an answer.

sampling:
  # Frozen so that repeated runs differ only through the sampler's own
  # nondeterminism, matching how the Sonnet runs were collected.
  temperature: 0.0
  top_p: 1.0
  max_tokens: 4096
  seed: null                # null: do not fix, variation is the object of study

# Recorded when the deployment runs, not configured:
#   vllm_version, torch_version, cuda_version, driver_version, gpu_name
