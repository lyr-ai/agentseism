<svg xmlns="http://www.w3.org/2000/svg" width="900" height="216" viewBox="0 0 900 216" role="img" aria-label="Three demo scenarios: normal noise PASS, capability collapse REGRESSION, not enough evidence INSUFFICIENT_EVIDENCE">
